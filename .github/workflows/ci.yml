name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"' 
      - name: Theme contrast and generator parity
        run: |
          python3 tools/palette_lab.py
          python3 tools/palette_lab.py --verify
      - name: Protocol, theme and app unit tests, lint, debug and unsigned release
        run: |
          set -o pipefail
          ./gradlew :transfer:test :youniversal:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --continue --stacktrace 2>&1 | tee build-verification.log
      - name: Compiler failures
        if: failure()
        run: |
          grep '^e: ' build-verification.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for p in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              for t in ET.parse(p).getroot().iter('testcase'):
                  for f in t.findall('failure') + t.findall('error'):
                      print('::error::' + (str(t.attrib) + ' ' + str(f.attrib) + ' ' + (f.text or '')[:2500]).replace('\n', '%0A'))
          PY
      - name: Other build failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('build-verification.log').read_text().splitlines()
          for i, line in enumerate(lines):
              if 'What went wrong:' in line or ': Error:' in line or 'tests completed' in line:
                  print('::error::' + '%0A'.join(lines[i:i+8]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightbridge-verification
          path: |
            build-verification.log
            **/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: lightbridge-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lightbridge-release-unsigned
          path: app/build/outputs/apk/release/*.apk
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Test failure annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for p in glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for t in ET.parse(p).getroot().iter('testcase'):
                  for f in t.findall('failure') + t.findall('error'):
                      print('::error::' + (str(t.attrib) + ' ' + (f.text or '')[:3000]).replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightbridge-android-smoke-results
          path: app/build/reports/androidTests/
